# ── Test-profile overrides ────────────────────────────────────────────────────
# Flapdoodle (de.flapdoodle.embed.mongo.spring31x) on the test classpath auto-
# configures an in-process embedded MongoDB, so no external MongoDB is needed.
# RedisCacheConfig is excluded via @Profile("!test"); simple cache is used here.

spring:
  data:
    mongodb:
      port: 0   # random available port; embedded MongoDB picks it up

  cache:
    type: simple
