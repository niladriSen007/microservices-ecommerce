spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_product_db
    username: postgres
    password: postgres
#    url: jdbc:postgresql://ep-soft-union-ambm9pod-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
#    username: neondb_owner
#    password: npg_7IQvUwtF9dHM
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
