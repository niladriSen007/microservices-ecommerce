services:
  mongo-product:
    image: mongo:latest
    container_name: mongo-product
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: ecommerce_product_db
    ports:
      - "27017:27017"
    volumes:
      - mongodbdata-product:/data/db
    networks:
      - ecomm-network

  postgres-order:
    image: postgres:18
    container_name: postgres-order
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_order_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata-order:/var/lib/postgresql
    networks:
      - ecomm-network

  postgres-inventory:
    image: postgres:18
    container_name: postgres-inventory
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_inventory_db
      TZ: Asia/Kolkata
    ports:
      - "5434:5432"
    volumes:
      - pgdata-inventory:/var/lib/postgresql
    networks:
      - ecomm-network

  mongo-user:
    image: mongo:latest
    container_name: mongo-user
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: ecommerce_user_db
    ports:
      - "27018:27017"
    volumes:
      - mongodbdata-user:/data/db
    networks:
      - ecomm-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    networks:
      - ecomm-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - ecomm-network

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data
    networks:
      - ecomm-network

  logstash:
    image: logstash:8.11.0
    container_name: logstash
    ports:
      - "5044:5044"
      - "5000:5000"
      - "9600:9600"
    volumes:
      - ./logstash/config:/usr/share/logstash/config
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - ecomm-network
    depends_on:
      - elasticsearch

  kibana:
    image: kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - ecomm-network
    depends_on:
      - elasticsearch

volumes:
  mongodbdata-product:
  pgdata-order:
  pgdata-inventory:
  mongodbdata-user:
  redisdata:
  elasticsearchdata:

networks:
  ecomm-network: