services:
  postgres-product:
    image: postgres:18
    container_name: postgres-product
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_product_db

      # ✅ Timezone configs
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata-product:/var/lib/postgresql
    command: >
      postgres
      -c timezone=Asia/Kolkata
      -c log_timezone=Asia/Kolkata
    networks:
      - ecomm-network

  postgres-order:
    image: postgres:18
    container_name: postgres-order
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_order_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata-order:/var/lib/postgresql
    networks:
      - ecomm-network

  mongo-user:
    image: mongo:latest
    container_name: mongo-user
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: ecommerce_user_db
    ports:
      - "27017:27017"
    volumes:
      - mongodbdata-user:/data/db
    networks:
      - ecomm-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    networks:
      - ecomm-network

volumes:
  pgdata-product:
  pgdata-order:
  mongodbdata-user:
  redisdata:

networks:
  ecomm-network: