name: CI – Product Service

# ─── Triggers ─────────────────────────────────────────────────────────────────
# Runs on every push directly to beta/main AND on every PR that targets those
# branches.  The required-status-check on the PR job is what blocks merges until
# both build and test pass (configured in GitHub → Settings → Branch protection).
on:
  push:
    branches:
      - main
      - beta
    paths:
      - "product-service/**"
      - ".github/workflows/ci-product-service.yml"

  pull_request:
    branches:
      - main
      - beta
    paths:
      - "product-service/**"
      - ".github/workflows/ci-product-service.yml"

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: read

# Cancel any in-progress run for the same branch/PR when a new commit is pushed
concurrency:
  group: ci-product-service-${{ github.ref }}
  cancel-in-progress: true

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: product-service

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 25 (matches <java.version>25</java.version> in pom.xml)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven # caches ~/.m2 between runs for faster builds

      # 3. Make the Maven wrapper executable
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 4. Run a clean build and all tests  ── this step MUST pass before a merge is allowed
      - name: Build and run tests
        # run: ./mvnw clean test --no-transfer-progress
        run: ./mvnw clean build --no-transfer-progress

      # 5. Upload Surefire test reports so failures are easy to inspect in the UI
      - name: Upload test reports
        if: always() # upload even when tests fail so we can debug
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: product-service/target/surefire-reports/
          retention-days: 7
