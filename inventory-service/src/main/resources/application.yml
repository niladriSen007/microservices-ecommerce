spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5434/ecommerce_inventory_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
  kafka:
#    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094, localhost:9095
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      group-id: order-service-group
      isolation-level: READ_COMMITTED
      auto-offset-reset: earliest
    admin:
      auto-create: true
    producer:
      acks: all
      retries: 3
      properties:
        max:
          in-flight.requests.per.connection: 5 # Ensure only 5 in-flight request per connection for idempotence
        # retry.backoff.ms: 1000 # 1 second delay between retries
        delivery.timeout.ms: 120000 # 2 minutes timeout for each request
        linger.ms: 0 # 0 ms delay between messages
        request.timeout.ms: 30000 # 30 seconds timeout for each request
        enable:
          idempotence: true # Enable idempotent producer to avoid duplicates
  #      transaction-id-prefix: product-service-${random.value}-

server:
  port: 8084
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
logging:
  level:
    io.micrometer.tracing: DEBUG
    zipkin2.reporter: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
